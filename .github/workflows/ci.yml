name: CalliLab CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  # ============================================================================
  # Stage 1: Static Analysis, Unit Testing, and Production Builds
  # ============================================================================
  test-and-build:
    name: Code Quality, Tests & Builds
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- Backend Checks ---
      - name: 3. Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 4. Execute Backend Tests (CalliVision AI Engine & Routes)
        run: |
          cd backend
          npm test

      # --- Frontend Checks ---
      - name: 5. Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 6. Run Frontend Static Analysis & ESLint
        run: |
          cd frontend
          npm run lint

      - name: 7. Execute Frontend Unit Tests
        run: |
          cd frontend
          npm test

      - name: 8. Verify Frontend Production Build (Vite)
        run: |
          cd frontend
          npm run build

      # --- Security & Vulnerability Audits ---
      - name: 9. Security Audit (Dependencies)
        run: |
          echo "Running dependency security review..."
          cd backend && npm audit --audit-level=critical || true
          cd ../frontend && npm audit --audit-level=critical || true

  # ============================================================================
  # Stage 2: Containerization & Docker Image Validation
  # ============================================================================
  docker-validation:
    name: Container Build & Validation
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Validate Backend Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: callilab-backend:ci-test

      - name: 4. Validate Frontend Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: callilab-frontend:ci-test

  # ============================================================================
  # Stage 3: Deployment Readiness Verification
  # ============================================================================
  deployment-check:
    name: Deployment Readiness Verification
    runs-on: ubuntu-latest
    needs: docker-validation
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Validate Deployment Manifests and Configurations
        run: |
          echo "Verifying deployment configuration files..."
          test -f docker-compose.yml || exit 1
          test -f backend/.env.example || exit 1
          echo "All deployment configuration checks passed."
