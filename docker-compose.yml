services:
  # ============================================================================
  # MongoDB Database Service
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: callilab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - callilab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Backend REST API Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callilab-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/calliverse
      - JWT_SECRET=calliverse_production_secret_key_change_in_env
      - CLIENT_URL=http://localhost:80
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - callilab-network
    volumes:
      - backend-uploads:/usr/src/app/uploads

  # ============================================================================
  # Frontend SPA Service (Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: callilab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - callilab-network

# ==============================================================================
# Persistent Volumes & Network Definitions
# ==============================================================================
volumes:
  mongo-data:
    name: callilab-mongo-data
  backend-uploads:
    name: callilab-backend-uploads

networks:
  callilab-network:
    name: callilab-network
    driver: bridge
